version: '3.7'
services:
  peer0.org1.fabric2.standard.com:
    container_name: peer0.org1.fabric2.standard.com
    image: hyperledger/fabric-peer:latest
    labels:
      service: hyperledger-fabric
      raft-network: fabric2-channel-standard
    environment:
      #Generic peer variables
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_raft_standard_net
    volumes:
      - ./docker/peercfg:/etc/hyperledger/peercfg
      - ${DOCKER_SOCK}:/host/var/run/docker.sock

  peer0.org2.fabric2.standard.com:
    container_name: peer0.org2.fabric2.standard.com
    image: hyperledger/fabric-peer:latest
    labels:
      service: hyperledger-fabric
      raft-network: fabric2-channel-standard
    environment:
      #Generic peer variables
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_raft_standard_net
    volumes:
      - ./docker/peercfg:/etc/hyperledger/peercfg
      - ${DOCKER_SOCK}:/host/var/run/docker.sock
