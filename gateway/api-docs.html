<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluasi RAFT HLF (Hyperledger Fabric) API Documentation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="http://31.97.107.123:5173/logo-gasnyoba.svg">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100">
    <div class="relative min-h-screen overflow-hidden">
        <div class="absolute inset-0 -z-10 h-full w-full">
            <div class="absolute -left-1/3 top-0 h-[720px] w-[720px] rounded-full bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 opacity-30 blur-3xl"></div>
            <div class="absolute -right-1/4 bottom-0 h-[620px] w-[620px] rounded-full bg-gradient-to-tr from-cyan-400 via-sky-500 to-indigo-500 opacity-30 blur-3xl"></div>
        </div>

        <div class="flex min-h-screen flex-col">
            <header class="relative isolate">
                <div class="mx-auto flex max-w-4xl flex-1 flex-col items-center justify-center px-6 py-24 text-center">
                    <span class="mb-6 inline-flex items-center rounded-full border border-indigo-400/50 bg-indigo-500/10 px-4 py-1 text-xs font-semibold uppercase tracking-[0.22em] text-indigo-200">Blockchain API Gateway</span>
                    <h1 class="text-4xl font-bold text-white md:text-5xl">Dokumentasi API Evaluasi RAFT HLF</h1>
                    <p class="mt-6 text-lg text-slate-300">Panduan terpusat untuk mengintegrasikan aplikasi Anda dengan gateway Hyperledger Fabric. Dokumentasi rinci akan segera tersedia.</p>
                </div>
            </header>

            <div class="flex-1"></div>

            <footer class="border-t border-white/10 bg-slate-950/80">
                <div class="mx-auto flex max-w-6xl flex-col gap-4 px-6 py-10 text-center text-sm text-slate-400 md:flex-row md:items-center md:justify-between">
                    <p>&copy; <span id="currentYear"></span> Evaluasi RAFT HLF. Seluruh hak cipta dilindungi.</p>
                    <p class="text-slate-500">Hubungi tim pengembang untuk akses dokumentasi lengkap.</p>
                </div>
            </footer>
        </div>
    </div>

    <script>
        const yearEl = document.getElementById('currentYear');
        if (yearEl) {
            yearEl.textContent = new Date().getFullYear();
        }
    </script>
</body>
</html>
