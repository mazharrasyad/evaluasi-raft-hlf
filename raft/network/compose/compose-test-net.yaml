volumes:
  orderer.raft:
  peer0.org1.raft:
  peer0.org2.raft:

networks:
  test:
    name: raft_net

services:

  orderer.raft:
    container_name: orderer.raft
    hostname: orderer.raft
    image: hyperledger/fabric-orderer:latest
    labels:
      service: hyperledger-fabric
      raft-network: raft
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=8055
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      # enabled TLS
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:8053
      - ORDERER_OPERATIONS_LISTENADDRESS=orderer.raft:9543
      - ORDERER_METRICS_PROVIDER=prometheus
    working_dir: /root
    command: orderer
    volumes:
        - ../organizations/ordererOrganizations/raft/orderers/orderer.raft/msp:/var/hyperledger/orderer/msp
        - ../organizations/ordererOrganizations/raft/orderers/orderer.raft/tls/:/var/hyperledger/orderer/tls
        - orderer.raft:/var/hyperledger/production/orderer
    ports:
      - 8055:8055
      - 8053:8053
      - 9543:9543
    networks:
      - test

  peer0.org1.raft:
    container_name: peer0.org1.raft
    hostname: peer0.org1.raft
    image: hyperledger/fabric-peer:latest
    labels:
      service: hyperledger-fabric
      raft-network: raft
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      #- FABRIC_LOGGING_SPEC=DEBUG
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      # Peer specific variables
      - CORE_PEER_ID=peer0.org1.raft
      - CORE_PEER_ADDRESS=peer0.org1.raft:7153
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7153
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.raft:7152
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7152
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.raft:7153
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.raft:7153
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.org1.raft:9544
      - CORE_METRICS_PROVIDER=prometheus
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer0org1"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    volumes:
      - ../organizations/peerOrganizations/org1.raft/peers/peer0.org1.raft:/etc/hyperledger/fabric
      - peer0.org1.raft:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - 7153:7153
      - 9544:9544
    networks:
      - test

  peer0.org2.raft:
    container_name: peer0.org2.raft
    hostname: peer0.org2.raft
    image: hyperledger/fabric-peer:latest
    labels:
      service: hyperledger-fabric
      raft-network: raft
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      #- FABRIC_LOGGING_SPEC=DEBUG
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      # Peer specific variables
      - CORE_PEER_ID=peer0.org2.raft
      - CORE_PEER_ADDRESS=peer0.org2.raft:9153
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9153
      - CORE_PEER_CHAINCODEADDRESS=peer0.org2.raft:9152
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9152
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org2.raft:9153
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org2.raft:9153
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.org2.raft:9545
      - CORE_METRICS_PROVIDER=prometheus
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer0org2"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    volumes:
      - ../organizations/peerOrganizations/org2.raft/peers/peer0.org2.raft:/etc/hyperledger/fabric
      - peer0.org2.raft:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - 9153:9153
      - 9545:9545
    networks:
      - test

