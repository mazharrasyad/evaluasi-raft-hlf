version: '3.7'

volumes:
  peer0.org3.fabric3.variant:

networks:
  test:
    name: fabric3_raft_variant_net

services:

  peer0.org3.fabric3.variant:
    container_name: peer0.org3.fabric3.variant
    image: hyperledger/fabric-peer:latest
    labels:
      service: hyperledger-fabric
      raft-network: fabric3-raft-variant
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      #Generic peer variables
      - FABRIC_LOGGING_SPEC=INFO
      #- FABRIC_LOGGING_SPEC=DEBUG
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      # Peer specific variables
      - CORE_PEER_ID=peer0.org3.fabric3.variant
      - CORE_PEER_ADDRESS=peer0.org3.fabric3.variant:11051
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_LISTENADDRESS=0.0.0.0:11051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org3.fabric3.variant:11052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:11052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org3.fabric3.variant:11051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org3.fabric3.variant:11051
      - CORE_PEER_LOCALMSPID=Org3MSP
    volumes:
        - ../peercfg:/etc/hyperledger/peercfg
        - ../../organizations-variant/peerOrganizations/org3.fabric3.variant/peers/peer0.org3.fabric3.variant:/etc/hyperledger/fabric
        - peer0.org3.fabric3.variant:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 11151:11051
    networks:
      - test
