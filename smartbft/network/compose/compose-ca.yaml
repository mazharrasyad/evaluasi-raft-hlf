networks:
  test:
    name: smartbft_net

services:

  ca_org1_variant:
    image: hyperledger/fabric-ca:latest
    labels:
      service: hyperledger-fabric
      raft-network: smartbft
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org1
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:17054
    ports:
      - "7354:7054"
      - "17354:17054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations-variant/fabric-ca/org1:/etc/hyperledger/fabric-ca-server
    container_name: ca_org1_fabric3_variant
    networks:
      - test

  ca_org2_variant:
    image: hyperledger/fabric-ca:latest
    labels:
      service: hyperledger-fabric
      raft-network: smartbft
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org2
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=8054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:18054
    ports:
      - "8354:8054"
      - "18354:18054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations-variant/fabric-ca/org2:/etc/hyperledger/fabric-ca-server
    container_name: ca_org2_fabric3_variant
    networks:
      - test

  ca_orderer_variant:
    image: hyperledger/fabric-ca:latest
    labels:
      service: hyperledger-fabric
      raft-network: smartbft
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-orderer
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=9054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:19054
    ports:
      - "9354:9054"
      - "19354:19054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations-variant/fabric-ca/ordererOrg:/etc/hyperledger/fabric-ca-server
    container_name: ca_orderer_fabric3_variant
    networks:
      - test

