services:
  peer0.org1.smartbft:
    container_name: peer0.org1.smartbft
    image: hyperledger/fabric-peer:latest
    labels:
      service: hyperledger-fabric
      raft-network: smartbft
    environment:
      #Generic peer variables
      - CORE_VM_ENDPOINT=${CORE_VM_ENDPOINT:-unix:///host/var/run/docker.sock}
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=smartbft_net
      - DOCKER_API_VERSION=1.44
    volumes:
      - ./docker/peercfg:/etc/hyperledger/peercfg
      - ${DOCKER_SOCK}:/host/var/run/docker.sock

  peer0.org2.smartbft:
    container_name: peer0.org2.smartbft
    image: hyperledger/fabric-peer:latest
    labels:
      service: hyperledger-fabric
      raft-network: smartbft
    environment:
      #Generic peer variables
      - CORE_VM_ENDPOINT=${CORE_VM_ENDPOINT:-unix:///host/var/run/docker.sock}
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=smartbft_net
      - DOCKER_API_VERSION=1.44
    volumes:
      - ./docker/peercfg:/etc/hyperledger/peercfg
      - ${DOCKER_SOCK}:/host/var/run/docker.sock

