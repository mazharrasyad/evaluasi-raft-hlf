<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluasi RAFT HLF &mdash; Pelaporan Wilayah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#38BDF8',
                        secondary: '#6366F1',
                        accent: '#F59E0B',
                        highlight: '#F97316',
                        soft: '#050B16',
                        surface: '#0F172A',
                        surfaceMuted: '#16213F',
                        border: '#1E293B',
                        muted: '#94A3B8',
                        textdark: '#E2E8F0'
                    }
                }
            }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../images/logo-ai-center.svg">
    <style>
        body { font-family: 'Inter', sans-serif; }

        .animate-on-scroll {
            opacity: 0;
            transform: translateY(32px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .animate-on-scroll.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .component-link[data-active="true"] {
            background-color: rgba(99, 102, 241, 0.25);
            color: #E2E8F0;
            border-color: rgba(99, 102, 241, 0.45);
        }

        .component-link[data-active="true"] .component-link__index {
            background-color: rgba(99, 102, 241, 0.45);
            color: #E2E8F0;
        }
    </style>
</head>
<body class="bg-soft text-textdark">
    <div class="relative min-h-screen overflow-hidden">
        <div class="absolute inset-0 -z-10 h-full w-full">
            <div class="absolute -left-1/3 top-0 h-[720px] w-[720px] rounded-full bg-gradient-to-br from-secondary/30 via-primary/40 to-transparent opacity-70 blur-3xl"></div>
            <div class="absolute -right-1/4 bottom-0 h-[620px] w-[620px] rounded-full bg-gradient-to-tr from-accent/40 via-secondary/20 to-primary/20 opacity-70 blur-3xl"></div>
        </div>

        <div class="flex min-h-screen flex-col lg:flex-row">
            <aside class="w-full border-b border-white/10 bg-surface/80 backdrop-blur lg:w-80 lg:border-r">
                <div class="mx-auto flex h-full max-w-3xl flex-col gap-6 px-6 py-8">
                    <div class="flex items-center gap-3 rounded-2xl border border-white/10 bg-surfaceMuted/70 p-4 shadow-lg shadow-black/10">
                        <span class="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-secondary/20 text-2xl text-secondary">☰</span>
                        <div class="flex flex-col">
                            <span class="text-xs uppercase tracking-[0.28em] text-secondary">Navigasi</span>
                            <span class="text-sm text-textdark/80">Pilih komponen dashboard</span>
                        </div>
                    </div>
                    <nav aria-label="Navigasi komponen" class="flex-1">
                        <ul class="space-y-2">
                            <li>
                                <button type="button" data-target="evaluasi-raft" class="component-link group flex w-full items-center gap-3 rounded-xl border border-white/10 bg-surface/60 px-4 py-3 text-left text-sm font-medium text-textdark/80 transition hover:-translate-y-0.5 hover:bg-secondary/20 hover:text-textdark focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary">
                                    <span class="component-link__index inline-flex h-8 w-8 flex-none items-center justify-center rounded-lg bg-secondary/20 text-secondary">1</span>
                                    <span class="flex-1">Evaluasi RAFT Hyperledger Fabric</span>
                                </button>
                            </li>
                            <li>
                                <button type="button" data-target="kesehatan-jaringan" class="component-link group flex w-full items-center gap-3 rounded-xl border border-white/10 bg-surface/60 px-4 py-3 text-left text-sm font-medium text-textdark/80 transition hover:-translate-y-0.5 hover:bg-secondary/20 hover:text-textdark focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary">
                                    <span class="component-link__index inline-flex h-8 w-8 flex-none items-center justify-center rounded-lg bg-secondary/20 text-secondary">2</span>
                                    <span class="flex-1">Kesehatan Jaringan Fabric</span>
                                </button>
                            </li>
                            <li>
                                <button type="button" data-target="rute-server" class="component-link group flex w-full items-center gap-3 rounded-xl border border-white/10 bg-surface/60 px-4 py-3 text-left text-sm font-medium text-textdark/80 transition hover:-translate-y-0.5 hover:bg-secondary/20 hover:text-textdark focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary">
                                    <span class="component-link__index inline-flex h-8 w-8 flex-none items-center justify-center rounded-lg bg-secondary/20 text-secondary">3</span>
                                    <span class="flex-1">Daftar Rute Server</span>
                                </button>
                            </li>
                            <li>
                                <button type="button" data-target="simulasi-data" class="component-link group flex w-full items-center gap-3 rounded-xl border border-white/10 bg-surface/60 px-4 py-3 text-left text-sm font-medium text-textdark/80 transition hover:-translate-y-0.5 hover:bg-secondary/20 hover:text-textdark focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary">
                                    <span class="component-link__index inline-flex h-8 w-8 flex-none items-center justify-center rounded-lg bg-secondary/20 text-secondary">4</span>
                                    <span class="flex-1">Simulasi Data Pelaporan</span>
                                </button>
                            </li>
                            <li>
                                <button type="button" data-target="peta-laporan" class="component-link group flex w-full items-center gap-3 rounded-xl border border-white/10 bg-surface/60 px-4 py-3 text-left text-sm font-medium text-textdark/80 transition hover:-translate-y-0.5 hover:bg-secondary/20 hover:text-textdark focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary">
                                    <span class="component-link__index inline-flex h-8 w-8 flex-none items-center justify-center rounded-lg bg-secondary/20 text-secondary">5</span>
                                    <span class="flex-1">Peta Laporan Wilayah</span>
                                </button>
                            </li>
                        </ul>
                    </nav>
                </div>
            </aside>

            <div class="flex-1">
                <main class="mx-auto w-full max-w-6xl px-6 py-12">
                    <div class="space-y-10" id="componentStack">
                        <div data-component="evaluasi-raft"></div>
                        <div data-component="kesehatan-jaringan"></div>
                        <div data-component="rute-server"></div>
                        <div data-component="simulasi-data"></div>
                        <div data-component="peta-laporan"></div>
                    </div>
                </main>

                <footer class="border-t border-white/10 bg-soft/80 text-textdark/70">
                    <div class="mx-auto flex max-w-6xl justify-center px-6 py-8 text-sm">
                        <p>&copy; <span id="currentYear"></span> Evaluasi RAFT HLF.</p>
                    </div>
                </footer>
            </div>
        </div>
    </div>

    <script src="../js/component-loader.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js" defer></script>
    <script src="../js/dashboard.js" defer></script>

    <div id="simulationModal" class="fixed inset-0 z-50 hidden">
        <div id="simulationModalOverlay" class="absolute inset-0 bg-soft/80 backdrop-blur-sm"></div>
        <div class="relative z-10 mx-auto flex min-h-full w-full max-w-4xl items-center justify-center px-4 py-12">
            <div class="w-full overflow-hidden rounded-3xl border border-white/10 bg-surface shadow-2xl shadow-black/30" role="dialog" aria-modal="true" aria-labelledby="simulationModalTitle" tabindex="-1">
                <header class="flex items-start justify-between gap-4 border-b border-white/10 bg-surfaceMuted/80 px-6 py-4">
                    <div class="space-y-1">
                        <p class="text-xs uppercase tracking-[0.3em] text-secondary">Detail Data Simulasi</p>
                        <h3 id="simulationModalTitle" class="text-lg font-semibold text-textdark">Kelurahan</h3>
                    </div>
                    <button type="button" id="simulationModalClose" class="inline-flex items-center justify-center rounded-full border border-white/10 bg-soft px-3 py-2 text-xs font-semibold uppercase tracking-[0.3em] text-textdark transition hover:bg-highlight hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-highlight">
                        Tutup
                    </button>
                </header>
                <div id="simulationModalContent" class="max-h-[65vh] overflow-y-auto bg-surfaceMuted/60 p-6 text-sm text-textdark"></div>
            </div>
        </div>
    </div>
</body>
</html>
