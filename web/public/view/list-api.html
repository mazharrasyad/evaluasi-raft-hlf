<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluasi RAFT HLF — List API</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#38BDF8',
                        secondary: '#6366F1',
                        accent: '#F59E0B',
                        highlight: '#F97316',
                        soft: '#050B16',
                        surface: '#0F172A',
                        surfaceMuted: '#16213F',
                        border: '#1E293B',
                        muted: '#94A3B8',
                        textdark: '#E2E8F0'
                    }
                }
            }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/images/logo-ai-center.svg">
    <style>
        body { font-family: 'Inter', sans-serif; }

        .method-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .method-get {
            background-color: rgba(16, 185, 129, 0.2);
            color: rgba(167, 243, 208, 0.95);
            border: 1px solid rgba(16, 185, 129, 0.45);
        }

        .method-post {
            background-color: rgba(56, 189, 248, 0.2);
            color: rgba(186, 230, 253, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.45);
        }

        .method-put {
            background-color: rgba(245, 158, 11, 0.2);
            color: rgba(254, 215, 170, 0.95);
            border: 1px solid rgba(245, 158, 11, 0.45);
        }

        .method-delete {
            background-color: rgba(244, 63, 94, 0.2);
            color: rgba(254, 205, 211, 0.95);
            border: 1px solid rgba(244, 63, 94, 0.45);
        }

        .api-card {
            background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 0.75rem;
            padding: 1.25rem;
            margin-bottom: 1rem;
            transition: all 0.2s ease;
        }

        .api-card:hover {
            border-color: rgba(56, 189, 248, 0.4);
            background-color: rgba(15, 23, 42, 0.95);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        .category-header {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15) 0%, rgba(99, 102, 241, 0.15) 100%);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 0.75rem;
            padding: 1rem 1.5rem;
            margin: 2rem 0 1.5rem 0;
        }

        .search-box {
            background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 0.75rem;
            padding: 0.75rem 1.25rem;
            width: 100%;
            color: #E2E8F0;
            font-size: 0.95rem;
        }

        .search-box:focus {
            outline: none;
            border-color: rgba(56, 189, 248, 0.5);
            background-color: rgba(15, 23, 42, 0.95);
        }

        .filter-button {
            background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 0.5rem;
            padding: 0.5rem 1rem;
            color: #94A3B8;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-button:hover,
        .filter-button.active {
            background-color: rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.45);
            color: #E2E8F0;
        }

        .stats-card {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.1) 0%, rgba(99, 102, 241, 0.1) 100%);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 0.75rem;
            padding: 1.5rem;
        }

        .code-block {
            background-color: rgba(5, 11, 22, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.85rem;
            color: rgba(148, 163, 184, 0.9);
            overflow-x: auto;
            margin-top: 0.5rem;
        }

        .loading-spinner {
            border: 3px solid rgba(148, 163, 184, 0.2);
            border-top: 3px solid #38BDF8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .component-link[data-active="true"] {
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.28), rgba(56, 189, 248, 0.22));
            color: #E2E8F0;
            border-color: rgba(249, 115, 22, 0.45);
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.45);
        }

        .component-link[data-active="true"] .component-link__index {
            background-color: rgba(249, 115, 22, 0.35);
            color: #E2E8F0;
        }
    </style>
</head>
<body class="bg-soft text-textdark">
    <div data-component="header"></div>
    <div class="relative min-h-screen overflow-hidden">
        <div class="absolute inset-0 -z-10 h-full w-full">
            <div class="absolute -left-1/3 top-0 h-[720px] w-[720px] rounded-full bg-gradient-to-br from-highlight/30 via-secondary/20 to-transparent opacity-70 blur-3xl"></div>
            <div class="absolute -right-1/4 bottom-0 h-[620px] w-[620px] rounded-full bg-gradient-to-tr from-accent/35 via-secondary/25 to-primary/20 opacity-70 blur-3xl"></div>
        </div>

        <div class="flex min-h-screen flex-col lg:flex-row">
            <div data-component="sidebar"></div>

            <div class="flex-1">
                <main class="mx-auto w-full max-w-5xl px-6 py-12">
        <!-- Stats Section -->
        <div id="statsSection" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <!-- Stats will be loaded here -->
        </div>

        <!-- Search and Filter -->
        <div class="mb-8">
            <div class="flex flex-col md:flex-row gap-4 mb-4">
                <div class="flex-1">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Cari API endpoint, method, atau deskripsi..."
                        class="search-box"
                    >
                </div>
            </div>
            <div class="flex flex-wrap gap-2" id="filterButtons">
                <button class="filter-button active" data-method="all">Semua</button>
                <button class="filter-button" data-method="GET">GET</button>
                <button class="filter-button" data-method="POST">POST</button>
                <button class="filter-button" data-method="PUT">PUT</button>
                <button class="filter-button" data-method="DELETE">DELETE</button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="text-center py-12">
            <div class="loading-spinner"></div>
            <p class="text-muted mt-4">Memuat daftar API...</p>
        </div>

        <!-- Error State -->
        <div id="errorState" class="hidden text-center py-12">
            <div class="text-red-400 text-5xl mb-4">⚠️</div>
            <p class="text-red-400 text-lg font-semibold mb-2">Gagal memuat API</p>
            <p class="text-muted" id="errorMessage"></p>
            <button onclick="location.reload()" class="mt-4 px-6 py-2 bg-primary/20 border border-primary/40 rounded-lg text-primary hover:bg-primary/30 transition-colors">
                Coba Lagi
            </button>
        </div>

        <!-- API List -->
        <div id="apiList" class="hidden">
            <!-- API endpoints will be loaded here -->
        </div>

        <!-- No Results -->
        <div id="noResults" class="hidden text-center py-12">
            <div class="text-muted text-5xl mb-4">🔍</div>
            <p class="text-muted text-lg">Tidak ada API yang cocok dengan pencarian Anda</p>
        </div>
                </main>

                <div data-component="footer"></div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="/js/list-api.js"></script>
    <script src="/js/layout.js" defer></script>
    <script src="/js/navigation.js" defer></script>
</body>
</html>
