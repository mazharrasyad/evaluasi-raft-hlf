<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluasi RAFT HLF — Penyimpanan Data Transaksi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#38BDF8',
                        secondary: '#6366F1',
                        accent: '#F59E0B',
                        highlight: '#F97316',
                        soft: '#050B16',
                        surface: '#0F172A',
                        surfaceMuted: '#16213F',
                        border: '#1E293B',
                        muted: '#94A3B8',
                        textdark: '#E2E8F0'
                    }
                }
            }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/images/logo-ai-center.svg">
    <style>
        body { font-family: 'Inter', sans-serif; }

        .component-link[data-active="true"] {
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.28), rgba(56, 189, 248, 0.22));
            color: #E2E8F0;
            border-color: rgba(249, 115, 22, 0.45);
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.45);
        }

        .component-link[data-active="true"] .component-link__index {
            background-color: rgba(249, 115, 22, 0.35);
            color: #E2E8F0;
        }

        .table-row {
            transition: all 0.2s ease;
        }

        .table-row:hover {
            background: rgba(56, 189, 248, 0.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }
    </style>
</head>
<body class="bg-soft text-textdark">
    <div data-component="header"></div>
    <div class="relative min-h-screen overflow-hidden">
        <div class="absolute inset-0 -z-10 h-full w-full">
            <div class="absolute -left-1/3 top-0 h-[720px] w-[720px] rounded-full bg-gradient-to-br from-highlight/30 via-secondary/20 to-transparent opacity-70 blur-3xl"></div>
            <div class="absolute -right-1/4 bottom-0 h-[620px] w-[620px] rounded-full bg-gradient-to-tr from-accent/35 via-secondary/25 to-primary/20 opacity-70 blur-3xl"></div>
        </div>

        <div class="flex min-h-screen flex-col lg:flex-row">
            <div data-component="sidebar"></div>

            <div class="flex-1">
                <main class="mx-auto w-full max-w-6xl px-6 py-12">
                    <div class="space-y-10">
                        <!-- Header Section -->
                        <section class="relative isolate overflow-hidden rounded-3xl border border-white/10 bg-gradient-to-br from-surface via-soft to-[#020817] p-10 shadow-2xl shadow-black/30">
                            <div class="flex flex-col gap-6">
                                <div class="inline-flex w-fit items-center gap-2 rounded-full border border-accent/40 bg-accent/10 px-4 py-1 text-xs font-semibold uppercase tracking-[0.3em] text-accent/90">
                                    Bab 4.4.4
                                </div>
                                <div class="space-y-5">
                                    <h1 class="text-3xl font-semibold text-textdark md:text-4xl">Penyimpanan Data Transaksi</h1>
                                    <p class="text-sm text-textdark/70 md:text-base leading-relaxed">
                                        Halaman ini menampilkan data blok simulasi yang telah diinput ke dalam blockchain network. Anda dapat melihat ringkasan total blok per network dan detail transaksi dalam bentuk tabel.
                                    </p>
                                </div>
                            </div>
                        </section>

                        <!-- Summary Section -->
                        <section class="relative isolate overflow-hidden rounded-3xl border border-white/10 bg-gradient-to-br from-surface via-soft to-[#020817] p-10 shadow-2xl shadow-black/30">
                            <div class="mb-6 flex items-center justify-between">
                                <h2 class="text-2xl font-semibold text-textdark">Ringkasan Penyimpanan Blok</h2>
                                <button type="button" id="refreshData"
                                    class="flex items-center gap-2 rounded-lg border border-primary/40 bg-primary/10 px-4 py-2 text-sm font-semibold text-primary transition hover:bg-primary/20">
                                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                                    </svg>
                                    Refresh Data
                                </button>
                            </div>

                            <div id="blockSummaryContainer" class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-4">
                                <!-- Loading state -->
                                <div class="flex items-center justify-center rounded-2xl border border-white/10 bg-surfaceMuted/70 p-6 shadow-lg">
                                    <svg class="h-8 w-8 animate-spin text-primary" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                </div>
                            </div>
                        </section>

                        <!-- Network Status Table Section -->
                        <section class="relative isolate overflow-hidden rounded-3xl border border-white/10 bg-gradient-to-br from-surface via-soft to-[#020817] p-10 shadow-2xl shadow-black/30">
                            <h2 class="mb-6 text-2xl font-semibold text-textdark">Status Network</h2>

                            <div id="tableContainer" class="overflow-hidden rounded-xl border border-white/10">
                                <!-- Loading state -->
                                <div class="flex items-center justify-center bg-surfaceMuted/50 p-12">
                                    <div class="text-center">
                                        <svg class="mx-auto mb-3 h-8 w-8 animate-spin text-primary" fill="none" viewBox="0 0 24 24">
                                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                        </svg>
                                        <p class="text-sm text-textdark/70">Memuat data network...</p>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                </main>

                <div data-component="footer"></div>
            </div>
        </div>
    </div>

    <script src="/js/layout.js" defer></script>
    <script src="/js/navigation.js" defer></script>
    <script src="/js/penyimpanan-data-transaksi.js" defer></script>
</body>
</html>
